<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB300;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lemonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE57F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGradient)"/>
  
  <!-- Main lemon shape - left side -->
  <ellipse cx="180" cy="260" rx="85" ry="95" fill="url(#lemonGradient)" stroke="#F57F17" stroke-width="3"/>
  
  <!-- Main lemon shape - right side -->
  <ellipse cx="330" cy="260" rx="85" ry="95" fill="url(#lemonGradient)" stroke="#F57F17" stroke-width="3"/>
  
  <!-- Bridge connecting lemons -->
  <ellipse cx="255" cy="260" rx="40" ry="80" fill="url(#lemonGradient)" stroke="#F57F17" stroke-width="3"/>
  
  <!-- Leaf - top left -->
  <g transform="translate(140, 80)">
    <ellipse cx="0" cy="0" rx="30" ry="50" fill="#66BB6A" stroke="#43A047" stroke-width="2" transform="rotate(-35)"/>
    <path d="M -8 -15 Q 0 -5 8 -15" stroke="#2E7D32" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Leaf - top right -->
  <g transform="translate(370, 80)">
    <ellipse cx="0" cy="0" rx="30" ry="50" fill="#66BB6A" stroke="#43A047" stroke-width="2" transform="rotate(35)"/>
    <path d="M -8 -15 Q 0 -5 8 -15" stroke="#2E7D32" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Highlight for depth -->
  <circle cx="200" cy="200" r="25" fill="white" opacity="0.3"/>
  <circle cx="310" cy="200" r="25" fill="white" opacity="0.3"/>
  
  <!-- Ripple/water effect at bottom - representing liquid/juice -->
  <path d="M 150 380 Q 180 370 255 380 Q 330 390 360 380 L 360 420 Q 330 430 255 420 Q 180 410 150 420 Z" fill="#81C784" opacity="0.4"/>
  <path d="M 140 400 Q 170 390 255 405 Q 340 420 370 400 L 370 450 Q 255 460 140 450 Z" fill="#66BB6A" opacity="0.3"/>
  
  <!-- Text badge -->
  <rect x="180" y="440" width="152" height="50" rx="10" fill="white" opacity="0.95" stroke="#F57F17" stroke-width="2"/>
  <text x="256" y="472" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#FFC107">LEMONADE</text>
</svg>