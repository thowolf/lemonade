name: Block ROCm additions

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  block-rocm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip

      - name: Run ROCm repository checker
        run: |
          python scripts/tools/check_no_rocm.py
