<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lemonade Playground</title>
  <style>body{font-family:Arial;margin:20px}textarea{width:100%;height:120px}</style>
</head>
<body>
  <h1>Lemonade Playground</h1>
  <label>Model: <input id="model" value="Llama-3.1-8B-Instruct-Hybrid" /></label>
  <p><textarea id="prompt">Translate to French: 'Hello, how are you?'</textarea></p>
  <button id="send">Send</button>
  <p>Latency: <span id="lat">-</span> ms</p>
  <h2>Response</h2>
  <pre id="response"></pre>

<script>
const send = document.getElementById('send')
send.onclick = async () => {
  const model = document.getElementById('model').value
  const prompt = document.getElementById('prompt').value
  const out = document.getElementById('response')
  const lat = document.getElementById('lat')
  out.textContent = '...'
  try{
    const body = { model, messages: [{ role: 'user', content: prompt }], max_tokens: 200 }
    const start = performance.now()
    const r = await fetch('/api/v1/chat/completions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
    const elapsed = performance.now() - start
    lat.textContent = elapsed.toFixed(2)
    const j = await r.json()
    out.textContent = JSON.stringify(j, null, 2)
  }catch(e){ out.textContent = String(e) }
}
</script>
</body>
</html>
