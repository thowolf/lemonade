version: '3.8'

services:
  # Llama Server - Port 8000
  llama-server:
    build:
      context: ../..
      dockerfile: scripts/multi-server/Dockerfile
    image: lemonade-server:latest
    container_name: lemonade-llama
    ports:
      - "8000:8000"
    environment:
      - MODEL=Llama-3.2-3B-Instruct
      - PORT=8000
      - LOG_LEVEL=info
      - LLAMACPP_BACKEND=vulkan
      - CTX_SIZE=4096
      - MAX_LOADED_MODELS=1 1 1 1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:ro
      - ./logs:/var/log/lemonade
    command: >
      lemonade-server serve
      --host 0.0.0.0
      --port 8000
      --log-level info
      --llamacpp-backend vulkan
      --max-loaded-models 1 1 1 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G

  # Qwen Server - Port 8001
  qwen-server:
    build:
      context: ../..
      dockerfile: scripts/multi-server/Dockerfile
    image: lemonade-server:latest
    container_name: lemonade-qwen
    ports:
      - "8001:8001"
    environment:
      - MODEL=Qwen3-0.6B-GGUF
      - PORT=8001
      - LOG_LEVEL=info
      - LLAMACPP_BACKEND=ryzenai
      - CTX_SIZE=2048
      - MAX_LOADED_MODELS=1 1 1 1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:ro
      - ./logs:/var/log/lemonade
    command: >
      lemonade-server serve
      --host 0.0.0.0
      --port 8001
      --log-level info
      --llamacpp-backend ryzenai
      --max-loaded-models 1 1 1 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  # Phi Server - Port 8002
  phi-server:
    build:
      context: ../..
      dockerfile: scripts/multi-server/Dockerfile
    image: lemonade-server:latest
    container_name: lemonade-phi
    ports:
      - "8002:8002"
    environment:
      - MODEL=Phi-4-mini
      - PORT=8002
      - LOG_LEVEL=info
      - LLAMACPP_BACKEND=ryzenai
      - CTX_SIZE=4096
      - MAX_LOADED_MODELS=1 1 1 1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:ro
      - ./logs:/var/log/lemonade
    command: >
      lemonade-server serve
      --host 0.0.0.0
      --port 8002
      --log-level info
      --llamacpp-backend ryzenai
      --max-loaded-models 1 1 1 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 6G

  # Optional: Nginx Reverse Proxy for Load Balancing
  # Uncomment to enable load balancing across all servers
  # nginx:
  #   image: nginx:alpine
  #   container_name: lemonade-proxy
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - llama-server
  #     - qwen-server
  #     - phi-server
  #   restart: unless-stopped

volumes:
  model-cache:
    driver: local

networks:
  default:
    name: lemonade-network
